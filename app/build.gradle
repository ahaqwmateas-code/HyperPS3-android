plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'aenu.aps3e'
    ndkVersion "26.1.10909125"
    compileSdk 35

    defaultConfig {
        applicationId "aenu.aps3e"
        minSdk 28
        targetSdk 35
        versionCode 150
        versionName "1.50.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DCMAKE_SIZEOF_VOID_P=8"
                // The emulator engine must be built optimized. Debug builds (the default
                // CMAKE_BUILD_TYPE for assembleDebug) compile all 4,544 C/C++ files at -O0
                // with full debug info, which makes the APK unusably slow and exhausts the
                // CI runner's memory (clang segfaults on several translation units).
                //
                // Force CMAKE_BUILD_TYPE=Release, but override the stock Release flags:
                // -O3 -g (the NDK toolchain still injects -g for the debuggable assembleDebug
                // variant) makes clang spike past the 7 GB GitHub runner limit on the biggest
                // rpcs3 translation units and die with SIGSEGV mid-compile (observed on
                // Input/raw_mouse_config.cpp at ~3900/4544 objects). -O2 without DWARF keeps
                // peak memory bounded while still producing a fast APK; -g0 cancels the -g.
                //
                // Even at -O2 -g0, AGP's default ninja parallelism (~4 jobs) still blew past
                // the 7 GB runner and crashed cc1plus (exit 139) on the emu target. The LLVM
                // in-tree build (add_subdirectory) wires these options into GLOBAL ninja job
                // pools (compile_job_pool/link_job_pool -> CMAKE_JOB_POOL_COMPILE/LINK), which
                // ninja enforces regardless of -j: 1 compile and 1 link at a time, so clang's
                // peak memory stays far below the runner limit.
                arguments "-DCMAKE_BUILD_TYPE=Release",
                          "-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG -g0",
                          "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG -g0",
                          "-DLLVM_PARALLEL_COMPILE_JOBS=1",
                          "-DLLVM_PARALLEL_LINK_JOBS=1",
                          "-DCMAKE_C_FLAGS_INIT=-fno-inline-functions",
                          "-DCMAKE_CXX_FLAGS_INIT=-fno-inline-functions"
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
        }
        debug {
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.preference
    implementation libs.documentfile
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
