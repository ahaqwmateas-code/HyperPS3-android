plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'aenu.aps3e'
    ndkVersion "26.1.10909125"
    compileSdk 35

    defaultConfig {
        applicationId "aenu.aps3e"
        minSdk 28
        targetSdk 35
        versionCode 150
        versionName "1.50.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DCMAKE_SIZEOF_VOID_P=8"
                // The emulator engine must be built optimized. Debug builds (the default
                // CMAKE_BUILD_TYPE for assembleDebug) compile all 4,544 C/C++ files at -O0
                // with full debug info, which makes the APK unusably slow and exhausts the
                // CI runner's memory (clang segfaults on several translation units).
                // Release keeps -O3 -DNDEBUG and drops -g/-fno-limit-debug-info.
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
        }
        debug {
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.preference
    implementation libs.documentfile
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
