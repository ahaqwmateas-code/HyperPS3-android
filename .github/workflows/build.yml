name: Build HyperPS3 APK
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, submodules: recursive }
      - uses: actions/cache@v4
        with:
          path: "~/.gradle/caches ~/.gradle/wrapper ~/.m2/repository"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
        with: { packages: "build-tools;34.0.0 platform-tools platforms;android-34 ndk;26.1.10909125 cmake;3.22.1" }
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2
        env: { JAVA_OPTS: "-Xmx3G -Xms1G", GRADLE_OPTS: "-Xmx3G" }
      - uses: actions/upload-artifact@v4
        with: { name: HyperPS3-Futuristic-v150, path: "app/build/outputs/apk/debug/*.apk", retention-days: 30 }
