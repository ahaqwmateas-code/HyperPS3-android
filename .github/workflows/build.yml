name: Build HyperPS3 APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK, NDK and CMake (with retry)
        run: |
          set -e
          RETRIES=3
          COUNT=0
          
          until [ $COUNT -ge $RETRIES ]; do
            echo "Attempt $((COUNT+1))/$RETRIES..."
            if $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
              "build-tools;34.0.0" \
              "platform-tools" \
              "platforms;android-34" \
              "ndk;26.1.10909125" \
              "cmake;3.22.1" \
              --channel=0 2>&1 | tee /tmp/sdkmanager.log; then
              echo "SDK packages installed successfully"
              break
            else
              COUNT=$((COUNT+1))
              if [ $COUNT -lt $RETRIES ]; then
                echo "Installation failed, retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
          
          if [ $COUNT -ge $RETRIES ]; then
            echo "SDK installation failed after $RETRIES attempts"
            cat /tmp/sdkmanager.log
            exit 1
          fi
          
          # Set environment variables
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_CMAKE_HOME=$ANDROID_SDK_ROOT/cmake/3.22.1" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('app/src/main/cpp/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install ccache + ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build
          ccache --set-config=max_size=3G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          # Keep the Gradle JVM heap small so the clang workers (the real memory
          # consumers during the native build) don't get starved/OOM-killed.
          GRADLE_BUILD() {
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --max-workers=1 \
              -Dorg.gradle.jvmargs="-Xmx1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" \
              -Dorg.gradle.parallel=false \
              -Dorg.gradle.caching=true
          }
          # The 4544-file native build is now serialized via ninja job pools, but
          # clang can still crash (exit 139) under residual memory pressure on a
          # 7 GB runner even with -O1 optimization. ninja is incremental, so a second
          # attempt only rebuilds the failed translation units (warm ccache makes it cheap)
          # instead of restarting the whole build.
          if ! GRADLE_BUILD; then
            echo "First native build attempt failed; retrying incrementally..."
            if ! GRADLE_BUILD; then
              echo "Second attempt failed; clearing ccache and retrying..."
              ccache -C
              GRADLE_BUILD
            fi
          fi
        env:
          JAVA_OPTS: "-Xmx1536m"
          GRADLE_OPTS: "-Xmx1536m -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HyperPS3-debug-${{ github.sha }}
          path: app/build/outputs/**/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            app/build/outputs/**
            app/.cxx/**/*.log
            **/*.log
          retention-days: 7
