      - name: Install clang++ interceptor
        run: |
          find /usr/local/lib/android/sdk/ndk -path "*/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" -type f -executable | while read -r CLANGXX; do
            echo "Intercepting: $CLANGXX"
            sudo mv "$CLANGXX" "${CLANGXX}.orig"
            
            sudo tee "$CLANGXX" > /dev/null << 'EOF'
          #!/bin/bash
          args=()
          all_args=("$@")
          i=0
          while [ $i -lt ${#all_args[@]} ]; do
              arg="${all_args[$i]}"
              # Handle "-isystem /path/to/sysroot/usr/include" (two separate arguments)
              if [ "$arg" = "-isystem" ]; then
                  next_idx=$((i+1))
                  if [ $next_idx -lt ${#all_args[@]} ]; then
                      next="${all_args[$next_idx]}"
                      if [[ "$next" == *"/sysroot/usr/include" ]] && [[ "$next" != *"/c++/"* ]]; then
                          i=$((i+2))
                          continue
                      fi
                  fi
              fi
              # Handle "-isystem/path/to/sysroot/usr/include" (single combined argument)
              if [[ "$arg" == -isystem*/sysroot/usr/include ]] && [[ "$arg" != *"/c++/"* ]]; then
                  i=$((i+1))
                  continue
              fi
              args+=("$arg")
              i=$((i+1))
          done
          exec "${0}.orig" "${args[@]}"
          EOF
            sudo chmod +x "$CLANGXX"
          done
          echo "clang++ interceptor installed"

      - name: Build
        run: ./gradlew assembleDebug

