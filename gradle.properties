# Gradle configuration for HyperPS3-Android
# This file contains gradle build properties

# Project Configuration
# Keep the Gradle JVM small: this project's heavy work is the native build
# (clang), which needs RAM on the runner. A 6GB Gradle heap starves the
# compilers and caused clang to segfault under memory pressure in CI.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android Build Configuration
android.useAndroidX=true
android.enableJetifier=true

# NDK Configuration
ndk.version=26.1.10909125
ndk.cmake.version=3.22.1

# Compilation Settings
android.compileSdk=35
android.minSdk=28
android.targetSdk=35

# C++ Flags
# Standard: C++17
# Optimization: -O3 for release, -O0 -g for debug
cmake.cppFlags=-std=c++17 -Wall -Wextra -Wpedantic

# Architecture
# Support only ARM64 for maximum performance
android.abis=arm64-v8a

# Build Behavior
android.enableBuildScanning=false
android.useDeprecatedNdk=false

# Performance
org.gradle.workers.max=8
org.gradle.vfs.watch.enabled=true
android.enableNewResourceIdGenerator=true